name: Aider Auto-Solve PRs

on:
  pull_request:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to solve (optional: if omitted, processes open PRs)'
        required: false
        type: string
      solve_all_open:
        description: 'Solve all currently open PRs (default: false)'
        required: false
        type: boolean
        default: false
      instructions:
        description: 'Custom instructions or specific task for Aider (optional)'
        required: false
        type: string
      model:
        description: 'LLM Model (e.g. claude-3-7-sonnet-20250219, gpt-4o, gemini/gemini-2.0-flash, deepseek/deepseek-chat)'
        required: false
        type: string

concurrency:
  group: aider-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || 'dispatch' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve-pr:
    name: Solve PR with Aider
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.title, '[skip aider]') &&
          !contains(github.event.pull_request.body, '[skip aider]') &&
          (
            github.event.action == 'opened' ||
            github.event.action == 'reopened' ||
            github.event.label.name == 'aider' ||
            contains(github.event.pull_request.labels.*.name, 'aider') ||
            contains(github.event.pull_request.title, '[aider]') ||
            contains(github.event.pull_request.body, '/aider')
          )
        ) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && (
          contains(github.event.comment.body, '/aider') ||
          contains(github.event.comment.body, '@aider') ||
          contains(github.event.comment.body, '/solve')
        )) ||
        (github.event_name == 'pull_request_review_comment' && (
          contains(github.event.comment.body, '/aider') ||
          contains(github.event.comment.body, '@aider') ||
          contains(github.event.comment.body, '/solve')
        ))
      )

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AIDER_YES_ALWAYS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global push.autoSetupRemote true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Select LLM Model
        id: select_model
        env:
          INPUT_MODEL: ${{ inputs.model }}
          REPO_MODEL: ${{ vars.AIDER_MODEL }}
        run: |
          if [ -n "$INPUT_MODEL" ]; then
            MODEL="$INPUT_MODEL"
          elif [ -n "$REPO_MODEL" ]; then
            MODEL="$REPO_MODEL"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            MODEL="claude-3-7-sonnet-20250219"
          elif [ -n "$OPENAI_API_KEY" ]; then
            MODEL="gpt-4o"
          elif [ -n "$GEMINI_API_KEY" ]; then
            MODEL="gemini/gemini-2.0-flash"
          elif [ -n "$DEEPSEEK_API_KEY" ]; then
            MODEL="deepseek/deepseek-chat"
          elif [ -n "$OPENROUTER_API_KEY" ]; then
            MODEL="openrouter/anthropic/claude-3.5-sonnet"
          else
            echo "::error::No LLM API key detected! Please add at least one secret (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, DEEPSEEK_API_KEY, or OPENROUTER_API_KEY) in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Selected model: $MODEL"
          echo "model=$MODEL" >> $GITHUB_OUTPUT

      - name: Determine PRs to solve
        id: get_prs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          SOLVE_ALL: ${{ inputs.solve_all_open }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "prs=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            echo "prs=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            echo "prs=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_PR" ]; then
              echo "prs=$INPUT_PR" >> $GITHUB_OUTPUT
            elif [ "$SOLVE_ALL" = "true" ]; then
              ALL_PRS=$(gh pr list --state open --json number -q '.[].number' | tr '\n' ' ')
              echo "Found open PRs: $ALL_PRS"
              echo "prs=$ALL_PRS" >> $GITHUB_OUTPUT
            else
              LABELED_PRS=$(gh pr list --state open --label "aider" --json number -q '.[].number' | tr '\n' ' ')
              if [ -z "$LABELED_PRS" ]; then
                LABELED_PRS=$(gh pr list --state open --json number -q '.[].number' | tr '\n' ' ')
              fi
              echo "Found open PRs to process: $LABELED_PRS"
              echo "prs=$LABELED_PRS" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Acknowledge comment trigger with reaction
        if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
        continue-on-error: true
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}/reactions" -f content='eyes' || true
          fi

      - name: Solve PRs with Aider
        env:
          PRS: ${{ steps.get_prs.outputs.prs }}
          SELECTED_MODEL: ${{ steps.select_model.outputs.model }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_INSTRUCTIONS: ${{ inputs.instructions }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ -z "$PRS" ]; then
            echo "No open PRs found to solve."
            exit 0
          fi

          for PR_NUM in $PRS; do
            echo "===================================================="
            echo "Processing PR #${PR_NUM}"
            echo "===================================================="

            # Fetch PR metadata
            PR_JSON=$(gh pr view "$PR_NUM" --json number,title,body,headRefName,isDraft,state)
            PR_STATE=$(echo "$PR_JSON" | jq -r '.state')
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
            PR_BODY=$(echo "$PR_JSON" | jq -r '.body // ""')
            HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')

            if [ "$PR_STATE" != "OPEN" ]; then
              echo "Skipping PR #${PR_NUM} because it is not open (state: $PR_STATE)."
              continue
            fi

            # Check out the PR branch
            echo "Checking out branch $HEAD_REF for PR #${PR_NUM}..."
            gh pr checkout "$PR_NUM" --force
            git pull origin "$HEAD_REF" --ff-only || true

            INITIAL_REV=$(git rev-parse HEAD)
            echo "Initial commit: $INITIAL_REV"

            # Check if last commit was already by aider to prevent duplicate work on pull_request events
            LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
            if [ "$EVENT_NAME" = "pull_request" ] && [[ "$LAST_COMMIT_MSG" == *"🤖 aider: solve PR #${PR_NUM}"* ]]; then
              echo "Latest commit on PR #${PR_NUM} was already applied by Aider. Skipping to prevent loop."
              continue
            fi

            # Build prompt file safely using Python
            export PR_NUM PR_TITLE PR_BODY
            python3 - << 'PYEOF'
import os

pr_num = os.environ.get("PR_NUM", "")
pr_title = os.environ.get("PR_TITLE", "")
pr_body = os.environ.get("PR_BODY", "")
comment_body = os.environ.get("COMMENT_BODY", "")
input_instructions = os.environ.get("INPUT_INSTRUCTIONS", "")
event_name = os.environ.get("EVENT_NAME", "")

if input_instructions.strip():
    prompt = f"""Task instructions:
{input_instructions}

Reference Pull Request #{pr_num}: {pr_title}
Description:
{pr_body}

Please inspect the codebase, implement the requested features or fixes, verify that tests and typechecks pass, and write clean, maintainable code."""

elif (event_name in ("issue_comment", "pull_request_review_comment")) and comment_body.strip():
    prompt = f"""A reviewer left the following feedback on PR #{pr_num}:
{comment_body}

Pull Request #{pr_num} Title: {pr_title}
Description:
{pr_body}

Please address the reviewer feedback, modify the codebase accordingly, and ensure that all tests pass."""

else:
    prompt = f"""Solve and implement Pull Request #{pr_num}:
Title: {pr_title}

Description:
{pr_body}

Please inspect the repository, implement all requested changes and requirements, ensure that 'npm run typecheck && npm test' passes, and produce clean, well-tested code."""

with open("/tmp/aider_prompt.txt", "w", encoding="utf-8") as f:
    f.write(prompt)
PYEOF

            echo "Invoking Aider with model: $SELECTED_MODEL..."

            # Run Aider with automated tests & non-interactive execution
            if ! aider \
              --model "$SELECTED_MODEL" \
              --test-cmd "npm run typecheck && npm test" \
              --auto-test \
              --yes-always \
              --no-check-update \
              --message-file /tmp/aider_prompt.txt; then

              echo "Aider encountered an error while processing PR #${PR_NUM}."
              python3 - << 'PYEOF'
import os
pr_num = os.environ.get("PR_NUM", "")
selected_model = os.environ.get("SELECTED_MODEL", "")

comment_content = f"""### ⚠️ Aider Execution Notice for PR #{pr_num}

Aider attempted to solve this PR using `{selected_model}`, but encountered an issue or tests could not be resolved automatically.

Please check the GitHub Actions workflow run logs for full details and test failure outputs."""

with open(f"/tmp/pr_comment_{pr_num}.md", "w", encoding="utf-8") as f:
    f.write(comment_content)
PYEOF
              gh pr comment "$PR_NUM" --body-file "/tmp/pr_comment_${PR_NUM}.md" || true
              continue
            fi

            # Commit any remaining uncommitted changes if created by aider
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "🤖 aider: solve PR #${PR_NUM} - automated implementation"
            fi

            FINAL_REV=$(git rev-parse HEAD)
            echo "Final commit: $FINAL_REV"

            if [ "$INITIAL_REV" != "$FINAL_REV" ]; then
              echo "Changes detected. Pushing to $HEAD_REF..."
              git fetch origin "$HEAD_REF"
              git push origin HEAD:"$HEAD_REF"

              COMMITS_LIST=$(git log --oneline "${INITIAL_REV}..${FINAL_REV}")
              export COMMITS_LIST

              python3 - << 'PYEOF'
import os

pr_num = os.environ.get("PR_NUM", "")
selected_model = os.environ.get("SELECTED_MODEL", "")
commits_list = os.environ.get("COMMITS_LIST", "")

comment_content = f"""### 🤖 Aider Solved PR #{pr_num}

Aider has implemented the requested changes for this PR.

**Model:** `{selected_model}`
**Verification:** `npm run typecheck && npm test` passed ✅

<details>
<summary><b>Commits applied:</b></summary>

```text
{commits_list}
```

</details>

Please review the updated code!"""

with open(f"/tmp/pr_comment_{pr_num}.md", "w", encoding="utf-8") as f:
    f.write(comment_content)
PYEOF

              gh pr comment "$PR_NUM" --body-file "/tmp/pr_comment_${PR_NUM}.md"
              gh pr edit "$PR_NUM" --add-label "aider-solved" || true

              # Acknowledge success on comment if triggered by comment
              if [ "$EVENT_NAME" = "issue_comment" ]; then
                gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content='rocket' || true
              fi
            else
              echo "No changes made by Aider on PR #${PR_NUM}."
              python3 - << 'PYEOF'
import os

pr_num = os.environ.get("PR_NUM", "")
selected_model = os.environ.get("SELECTED_MODEL", "")

comment_content = f"""### 🤖 Aider Notice for PR #{pr_num}

Aider evaluated this PR using `{selected_model}`, but no file changes were needed (type checks and test suites are already passing and requirements are satisfied)."""

with open(f"/tmp/pr_comment_{pr_num}.md", "w", encoding="utf-8") as f:
    f.write(comment_content)
PYEOF
              gh pr comment "$PR_NUM" --body-file "/tmp/pr_comment_${PR_NUM}.md" || true
            fi

          done
